<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Kód Vadászat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body class="bg-neutral-900 text-neutral-100 min-h-screen p-4 sm:p-6 font-sans">
  <div class="max-w-xl mx-auto space-y-6">
    
    <!-- Fejléc -->
    <header class="text-center pt-4">
      <h1 class="text-2xl font-bold text-orange-500">QR Kód Vadászat</h1>
      <p class="text-xs text-neutral-400 mt-1">Találd meg a kódokat, gyűjtsd a pontokat!</p>
    </header>
    
    <!-- Értesítési sáv -->
    <div id="status-card" class="hidden p-4 rounded-lg bg-neutral-800 border border-orange-500/40 text-center">
      <p id="status-message" class="text-amber-300 font-semibold text-sm mb-3"></p>
      
      <!-- Névbeviteli űrlap -->
      <div id="name-form" class="hidden flex flex-col sm:flex-row gap-2 justify-center items-center max-w-sm mx-auto">
        <input type="text" id="finder-name-input" placeholder="A neved..." class="px-3 py-2 text-sm rounded bg-neutral-900 border border-neutral-700 text-neutral-100 placeholder-neutral-500 focus:outline-none focus:border-orange-500 w-full sm:w-auto">
        <button id="save-name-btn" class="px-4 py-2 text-sm bg-orange-600 hover:bg-orange-500 text-white font-semibold rounded w-full sm:w-auto transition">
          Mentés
        </button>
      </div>
    </div>

    <!-- Ranglista szekció -->
    <section class="bg-neutral-800/60 p-4 rounded-lg border border-neutral-700/60">
      <h2 class="text-sm font-bold text-orange-400 uppercase tracking-wider mb-3 border-b border-neutral-700/60 pb-2">
        Ranglista
      </h2>
      <div id="leaderboard" class="space-y-1.5 text-sm">
        <p class="text-neutral-500 text-xs italic">Betöltés...</p>
      </div>
    </section>

    <!-- QR-kódok listája -->
    <section class="space-y-3">
      <h2 class="text-sm font-bold text-neutral-400 uppercase tracking-wider">
        Kódok állapota
      </h2>
      <div id="code-list" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <p class="text-neutral-500 text-xs italic col-span-2 text-center py-2">Betöltés...</p>
      </div>
    </section>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDIMi7p8hoiiRjUP1zWMohMn0VUYX8jrYU",
      authDomain: "qr-game-5d51b.firebaseapp.com",
      projectId: "qr-game-5d51b",
      storageBucket: "qr-game-5d51b.firebasestorage.app",
      messagingSenderId: "164175283230",
      appId: "1:164175283230:web:9c04c2fabec9c3600f5a0f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const scannedCode = urlParams.get('code');

    function triggerConfetti() {
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 80,
          spread: 60,
          origin: { y: 0.6 },
          colors: ['#ea580c', '#d97706', '#ffffff']
        });
      }
    }

    async function initGame() {
      const statusCard = document.getElementById('status-card');
      const statusEl = document.getElementById('status-message');
      const nameForm = document.getElementById('name-form');
      const saveBtn = document.getElementById('save-name-btn');
      const nameInput = document.getElementById('finder-name-input');

      if (scannedCode) {
        statusCard.classList.remove('hidden');
        try {
          const docRef = doc(db, "qrcodes", scannedCode);
          const docSnap = await getDoc(docRef);

          if (docSnap.exists()) {
            const data = docSnap.data();
            const points = Number(data.points) || 1;
            
            if (!data.isFound) {
              triggerConfetti();
              statusEl.innerText = `Megtaláltad a következőt: ${data.name} (${points} pont)! Add meg a neved:`;
              nameForm.classList.remove('hidden');
            } else {
              const finder = data.finderName ? data.finderName : "Valaki";
              statusEl.innerText = `Ezt a kódot (${data.name}) már megtalálta: ${finder}.`;
            }
          } else {
            statusEl.innerText = "Ez a QR-kód nem létezik.";
          }
        } catch (error) {
          console.error("Hiba a kód feldolgozásakor:", error);
          statusEl.innerText = "Hiba történt a beolvasáskor.";
        }
      }

      saveBtn.onclick = async () => {
        const name = nameInput.value.trim() || "Névtelen játékos";

        try {
          const docRef = doc(db, "qrcodes", scannedCode);
          await updateDoc(docRef, { 
            isFound: true, 
            finderName: name 
          });

          triggerConfetti();
          nameForm.classList.add('hidden');
          statusEl.innerText = `Kész! Elmentettük a pontodat, ${name}.`;
          await loadCodeListAndLeaderboard();
        } catch (error) {
          console.error("Hiba a név mentésekor:", error);
        }
      };

      await loadCodeListAndLeaderboard();
    }

    async function loadCodeListAndLeaderboard() {
      const querySnapshot = await getDocs(collection(db, "qrcodes"));
      const listEl = document.getElementById('code-list');
      const leaderboardEl = document.getElementById('leaderboard');
      
      listEl.innerHTML = "";
      leaderboardEl.innerHTML = "";

      const scores = {};

      querySnapshot.forEach((docSnapshot) => {
        const data = docSnapshot.data();
        const card = document.createElement('div');
        
        const isFound = data.isFound;
        const finder = data.finderName;
        const points = Number(data.points) || 1;

        if (isFound && finder) {
          scores[finder] = (scores[finder] || 0) + points;
        }

        card.className = `p-3 rounded border text-sm flex flex-col justify-between ${
          isFound 
            ? 'bg-neutral-800/30 border-orange-500/20 text-neutral-300' 
            : 'bg-neutral-800/80 border-neutral-700/80 text-neutral-400'
        }`;

        card.innerHTML = `
          <div class="flex justify-between items-center mb-2">
            <span class="font-medium text-neutral-200">${data.name}</span>
            <span class="px-2 py-0.5 text-[10px] font-semibold rounded ${
              isFound 
                ? 'bg-orange-500/10 text-orange-400 border border-orange-500/20' 
                : 'bg-neutral-700/50 text-neutral-500'
            }">
              ${isFound ? 'MEGTALÁLVA' : 'REJTVE'}
            </span>
          </div>
          <div class="flex justify-between items-center text-xs text-neutral-400 pt-2 border-t border-neutral-700/40">
            <span>${points} pont</span>
            ${
              isFound && finder 
                ? `<span class="text-orange-300/90">${finder}</span>` 
                : '<span class="text-neutral-600 italic">Még keresik</span>'
            }
          </div>
        `;
        listEl.appendChild(card);
      });

      const sortedPlayers = Object.entries(scores).sort((a, b) => b[1] - a[1]);

      if (sortedPlayers.length === 0) {
        leaderboardEl.innerHTML = `<p class="text-neutral-500 text-xs italic py-1">Még senki nem szerzett pontot.</p>`;
      } else {
        sortedPlayers.forEach(([player, score], index) => {
          const row = document.createElement('div');
          row.className = "flex justify-between items-center py-1 px-2 rounded bg-neutral-900/50 border border-neutral-800/80 text-xs";
          
          row.innerHTML = `
            <span class="font-medium text-neutral-300">${index + 1}. ${player}</span>
            <span class="font-bold text-orange-400">${score} pont</span>
          `;
          leaderboardEl.appendChild(row);
        });
      }
    }

    initGame();
  </script>
</body>
</html>
