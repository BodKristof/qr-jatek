<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Kód Vadászat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body class="bg-gradient-to-br from-neutral-950 via-neutral-900 to-orange-950 text-amber-50 min-h-screen p-4 sm:p-8 selection:bg-orange-500 selection:text-white">
  <div class="max-w-2xl mx-auto space-y-8">
    
    <!-- Fejléc -->
    <div class="text-center space-y-2">
      <div class="inline-block p-3 rounded-full bg-orange-500/10 border border-orange-500/20 mb-1 shadow-inner">
        <span class="text-3xl">🔍</span>
      </div>
      <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-orange-400 via-amber-300 to-orange-500 tracking-tight">
        QR Kód Vadászat
      </h1>
      <p class="text-sm text-neutral-400 font-medium">Keresd meg a kódokat és gyűjtsd a pontokat!</p>
    </div>
    
    <!-- Értesítési sáv -->
    <div id="status-card" class="hidden p-6 rounded-2xl bg-neutral-900/80 backdrop-blur-md border border-orange-500/50 text-center shadow-2xl shadow-orange-950/40 relative overflow-hidden transition-all">
      <div class="absolute -right-10 -top-10 w-32 h-32 bg-orange-500/10 rounded-full blur-2xl"></div>
      
      <p id="status-message" class="text-amber-300 text-lg font-bold mb-4 relative z-10"></p>
      
      <!-- Névbeviteli űrlap -->
      <div id="name-form" class="hidden flex flex-col sm:flex-row gap-3 justify-center items-center relative z-10 max-w-md mx-auto">
        <input type="text" id="finder-name-input" placeholder="A te neved..." class="px-4 py-3 rounded-xl bg-neutral-950/80 border border-orange-500/30 text-amber-100 placeholder-neutral-500 focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20 w-full transition shadow-inner">
        <button id="save-name-btn" class="px-6 py-3 bg-gradient-to-r from-orange-500 to-amber-600 hover:from-orange-400 hover:to-amber-500 text-white font-bold rounded-xl w-full sm:w-auto transition shadow-lg shadow-orange-600/30 active:scale-95">
          Mentés
        </button>
      </div>
    </div>

    <!-- Ranglista szekció -->
    <div class="bg-neutral-900/60 backdrop-blur-md p-6 rounded-2xl border border-neutral-800 shadow-xl relative overflow-hidden">
      <div class="flex items-center justify-between mb-4 border-b border-neutral-800 pb-3">
        <h2 class="text-xl font-bold text-orange-400 flex items-center gap-2">
          <span>🏆</span> Dicsőségfal
        </h2>
        <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-orange-500/10 border border-orange-500/20 text-orange-300">Összesített</span>
      </div>
      <div id="leaderboard" class="space-y-2 text-sm">
        <p class="text-neutral-500 italic text-center py-2">Betöltés...</p>
      </div>
    </div>

    <!-- QR-kódok listája -->
    <div class="space-y-4">
      <h2 class="text-xl font-bold text-neutral-200 flex items-center gap-2">
        <span>📍</span> Felfedezendő Kódok
      </h2>
      <div id="code-list" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <p class="text-neutral-500 italic col-span-2 text-center py-4">Betöltés...</p>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDIMi7p8hoiiRjUP1zWMohMn0VUYX8jrYU",
      authDomain: "qr-game-5d51b.firebaseapp.com",
      projectId: "qr-game-5d51b",
      storageBucket: "qr-game-5d51b.firebasestorage.app",
      messagingSenderId: "164175283230",
      appId: "1:164175283230:web:9c04c2fabec9c3600f5a0f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const scannedCode = urlParams.get('code');

    function triggerConfetti() {
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 120,
          spread: 80,
          origin: { y: 0.6 },
          colors: ['#f97316', '#f59e0b', '#ef4444', '#ffffff', '#fbbf24']
        });
      }
    }

    async function initGame() {
      const statusCard = document.getElementById('status-card');
      const statusEl = document.getElementById('status-message');
      const nameForm = document.getElementById('name-form');
      const saveBtn = document.getElementById('save-name-btn');
      const nameInput = document.getElementById('finder-name-input');

      if (scannedCode) {
        statusCard.classList.remove('hidden');
        try {
          const docRef = doc(db, "qrcodes", scannedCode);
          const docSnap = await getDoc(docRef);

          if (docSnap.exists()) {
            const data = docSnap.data();
            const points = Number(data.points) || 1;
            
            if (!data.isFound) {
              // KONFETTI AZONNAL BEOLVASÁSKOR
              triggerConfetti();

              statusEl.innerText = `🎉 Gratulálunk! Megtaláltad a(z) ${data.name} kódját (${points} pont)!`;
              nameForm.classList.remove('hidden');
            } else {
              const finder = data.finderName ? data.finderName : "Valaki";
              statusEl.innerText = `Ezt a kódot (${data.name}) már megtalálta: ${finder}!`;
            }
          } else {
            statusEl.innerText = "Érvénytelen QR kód!";
          }
        } catch (error) {
          console.error("Hiba a kód feldolgozásakor:", error);
          statusEl.innerText = "Hiba történt a kód beolvasásakor.";
        }
      }

      saveBtn.onclick = async () => {
        const name = nameInput.value.trim() || "Névtelen megtaláló";

        try {
          const docRef = doc(db, "qrcodes", scannedCode);
          await updateDoc(docRef, { 
            isFound: true, 
            finderName: name 
          });

          // Újabb konfetti mentéskor
          triggerConfetti();
          
          nameForm.classList.add('hidden');
          statusEl.innerText = `Köszönjük, ${name}! A pontjaid elmentve. 🌟`;
          await loadCodeListAndLeaderboard();
        } catch (error) {
          console.error("Hiba a név mentésekor:", error);
        }
      };

      await loadCodeListAndLeaderboard();
    }

    async function loadCodeListAndLeaderboard() {
      const querySnapshot = await getDocs(collection(db, "qrcodes"));
      const listEl = document.getElementById('code-list');
      const leaderboardEl = document.getElementById('leaderboard');
      
      listEl.innerHTML = "";
      leaderboardEl.innerHTML = "";

      const scores = {};

      querySnapshot.forEach((docSnapshot) => {
        const data = docSnapshot.data();
        const card = document.createElement('div');
        
        const isFound = data.isFound;
        const finder = data.finderName;
        const points = Number(data.points) || 1;

        if (isFound && finder) {
          scores[finder] = (scores[finder] || 0) + points;
        }

        card.className = `p-5 rounded-2xl border transition-all duration-300 flex flex-col justify-between ${
          isFound 
            ? 'bg-neutral-900/40 border-orange-500/30 text-amber-200 shadow-md' 
            : 'bg-neutral-900/80 border-neutral-800 text-neutral-400 hover:border-neutral-700'
        }`;

        card.innerHTML = `
          <div class="flex justify-between items-start mb-3">
            <span class="font-bold text-lg text-neutral-100">${data.name}</span>
            <span class="px-3 py-1 text-xs font-extrabold rounded-full tracking-wider ${
              isFound 
                ? 'bg-orange-500/20 text-orange-400 border border-orange-500/30' 
                : 'bg-neutral-800 text-neutral-500 border border-neutral-700'
            }">
              ${isFound ? 'MEGTALÁLVA' : 'REJTVE'}
            </span>
          </div>
          <div class="flex justify-between items-center text-xs pt-3 border-t border-neutral-800/80">
            <span class="font-bold text-amber-400 bg-amber-400/10 px-2.5 py-1 rounded-lg border border-amber-400/20">
              ⭐ ${points} pont
            </span>
            ${
              isFound && finder 
                ? `<span class="text-neutral-400">Megtaláló: <strong class="text-orange-300 font-semibold">${finder}</strong></span>` 
                : '<span class="text-neutral-600 italic">Még keresi valaki...</span>'
            }
          </div>
        `;
        listEl.appendChild(card);
      });

      const sortedPlayers = Object.entries(scores).sort((a, b) => b[1] - a[1]);

      if (sortedPlayers.length === 0) {
        leaderboardEl.innerHTML = `<p class="text-neutral-500 italic text-center py-2">Még senki nem szerzett pontot.</p>`;
      } else {
        const medals = ['🥇', '🥈', '🥉'];
        sortedPlayers.forEach(([player, score], index) => {
          const row = document.createElement('div');
          const medal = medals[index] || `<span class="text-neutral-500 font-mono w-5 inline-block text-center">${index + 1}.</span>`;
          
          row.className = `flex justify-between items-center py-2.5 px-3.5 rounded-xl transition ${
            index === 0 
              ? 'bg-gradient-to-r from-orange-500/20 to-amber-500/10 border border-orange-500/30 text-amber-200' 
              : 'bg-neutral-950/40 border border-neutral-800/60 text-neutral-300'
          }`;
          
          row.innerHTML = `
            <div class="flex items-center gap-2.5">
              <span class="text-base">${medal}</span>
              <span class="font-semibold">${player}</span>
            </div>
            <span class="font-extrabold text-orange-400 bg-orange-500/10 px-2.5 py-0.5 rounded-md border border-orange-500/20">${score} pt</span>
          `;
          leaderboardEl.appendChild(row);
        });
      }
    }

    initGame();
  </script>
</body>
</html>
