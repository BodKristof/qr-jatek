<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Kód Vadászat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body class="bg-neutral-900 text-neutral-100 min-h-screen p-4 sm:p-6 font-sans">
  <div class="max-w-xl mx-auto space-y-6">
    
    <!-- Fejléc -->
    <header class="text-center pt-4">
      <h1 class="text-2xl font-bold text-orange-500">QR Kód Vadászat</h1>
      <p class="text-xs text-neutral-400 mt-1">Találd meg a kódokat, gyűjtsd a pontokat!</p>
    </header>
    
    <!-- Értesítési sáv -->
    <div id="status-card" class="hidden p-4 rounded-lg bg-neutral-800 border border-orange-500/40 text-center">
      <p id="status-message" class="text-amber-300 font-semibold text-sm mb-3"></p>
      
      <!-- Névbeviteli űrlap -->
      <div id="name-form" class="hidden flex flex-col sm:flex-row gap-2 justify-center items-center max-w-sm mx-auto">
        <input type="text" id="finder-name-input" placeholder="A neved..." class="px-3 py-2 text-sm rounded bg-neutral-900 border border-neutral-700 text-neutral-100 placeholder-neutral-500 focus:outline-none focus:border-orange-500 w-full sm:w-auto">
        <button id="save-name-btn" class="px-4 py-2 text-sm bg-orange-600 hover:bg-orange-500 text-white font-semibold rounded w-full sm:w-auto transition">
          Mentés
        </button>
      </div>
    </div>

    <!-- Ranglista szekció -->
    <section class="bg-neutral-800/60 p-4 rounded-lg border border-neutral-700/60">
      <h2 class="text-sm font-bold text-orange-400 uppercase tracking-wider mb-3 border-b border-neutral-700/60 pb-2">
        Ranglista
      </h2>
      <div id="leaderboard" class="space-y-1.5 text-sm">
        <p class="text-neutral-500 text-xs italic">Betöltés...</p>
      </div>
    </section>

    <!-- QR-kódok listája -->
    <section class="space-y-3">
      <h2 class="text-sm font-bold text-neutral-400 uppercase tracking-wider">
        Titkok állapota (30 db)
      </h2>
      <div id="code-list" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <p class="text-neutral-500 text-xs italic col-span-2 text-center py-2">Betöltés...</p>
      </div>
    </section>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, getDoc, setDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDIMi7p8hoiiRjUP1zWMohMn0VUYX8jrYU",
      authDomain: "qr-game-5d51b.firebaseapp.com",
      projectId: "qr-game-5d51b",
      storageBucket: "qr-game-5d51b.firebasestorage.app",
      messagingSenderId: "164175283230",
      appId: "1:164175283230:web:9c04c2fabec9c3600f5a0f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const scannedCode = urlParams.get('code');
    const isSetupMode = urlParams.get('setup');

    const generatedCodes = [
      "PrB5arKF6hSS",
      "hhT7I64f3Cd7",
      "KLjJw3VbGU6D",
      "iHdCuByxN44g",
      "wYJNEHOyBu9Z",
      "ShO313xvkuzB",
      "Ki5HE2rz4K8E",
      "3TdOCDTHZ7td",
      "lhNCKWjO1gI4",
      "jGGumRHx6QJA",
      "cnYGIpjBapfY",
      "EEIXl2GJCzFx",
      "wc5acjvx1js1",
      "fHkFSZJ54je9",
      "F97yYHtVoTrH",
      "8nGGCzw7zeNL",
      "paiewexYrZTh",
      "QexBvAEcgZZH",
      "fYyfX2TlQ8qB",
      "dpCXkiE8CElu",
      "Bw9Cl5cimluZ",
      "tsweIaVpVJbz",
      "AGAaAMOn3xEp",
      "GPRCKafBSHhV",
      "FhBvbTHvVAOr",
      "iOxNegbdIsK7",
      "goUJ5SSx0en4",
      "yKVp3NovFE4k",
      "Ca62zrZ3ijMt",
      "LVqKi2Uq4cb3"
    ];

    async function setupDatabase() {
      const statusCard = document.getElementById('status-card');
      const statusEl = document.getElementById('status-message');
      statusCard.classList.remove('hidden');
      statusEl.innerText = "Régi kódok törlése és az új 30 titok beállítása...";

      try {
        // 1. Régi adatbázis tartalom törlése
        const oldDocs = await getDocs(collection(db, "qrcodes"));
        for (const oldDoc of oldDocs.docs) {
          await deleteDoc(doc(db, "qrcodes", oldDoc.id));
        }

        // 2. Csak a 30 új kód feltöltése
        for (let i = 0; i < generatedCodes.length; i++) {
          const codeId = generatedCodes[i];
          
          let points = 1;
          if (i >= 10 && i < 20) points = 2;
          else if (i >= 20) points = 3;

          await setDoc(doc(db, "qrcodes", codeId), {
            name: `${i + 1}. titok`,
            isFound: false,
            finderName: "",
            points: points,
            imageUrl: ""
          });
        }

        statusEl.innerText = "Adatbázis megtisztítva és az új 30 titok elmentve! Az oldal újratöltődik...";
        setTimeout(() => {
          window.location.href = window.location.pathname;
        }, 2000);
      } catch (error) {
        console.error("Hiba a setup során:", error);
        statusEl.innerText = "Hiba történt az adatbázis frissítésekor.";
      }
    }

    function triggerConfetti() {
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 80,
          spread: 60,
          origin: { y: 0.6 },
          colors: ['#ea580c', '#d97706', '#ffffff']
        });
      }
    }

    async function initGame() {
      if (isSetupMode === 'true') {
        await setupDatabase();
        return;
      }

      const statusCard = document.getElementById('status-card');
      const statusEl = document.getElementById('status-message');
      const nameForm = document.getElementById('name-form');
      const saveBtn = document.getElementById('save-name-btn');
      const nameInput = document.getElementById('finder-name-input');

      if (scannedCode) {
        statusCard.classList.remove('hidden');
        try {
          const docRef = doc(db, "qrcodes", scannedCode);
          const docSnap = await getDoc(docRef);

          if (docSnap.exists()) {
            const data = docSnap.data();
            const points = Number(data.points) || 1;
            
            if (!data.isFound) {
              triggerConfetti();
              statusEl.innerText = `Felfedtél egy titkot: ${data.name} (${points} pont)! Add meg a neved:`;
              nameForm.classList.remove('hidden');
            } else {
              const finder = data.finderName ? data.finderName : "Valaki";
              statusEl.innerText = `Ezt a titkot (${data.name}) már felfedte: ${finder}.`;
            }
          } else {
            statusEl.innerText = "Ez a QR-kód nem létezik.";
          }
        } catch (error) {
          console.error("Hiba a kód feldolgozásakor:", error);
          statusEl.innerText = "Hiba történt a beolvasáskor.";
        }
      }

      saveBtn.onclick = async () => {
        const name = nameInput.value.trim() || "Névtelen játékos";

        try {
          const docRef = doc(db, "qrcodes", scannedCode);
          await updateDoc(docRef, { 
            isFound: true, 
            finderName: name 
          });

          triggerConfetti();
          nameForm.classList.add('hidden');
          statusEl.innerText = `Kész! Elmentettük a pontodat, ${name}.`;
          await loadCodeListAndLeaderboard();
        } catch (error) {
          console.error("Hiba a név mentésekor:", error);
        }
      };

      await loadCodeListAndLeaderboard();
    }

    async function loadCodeListAndLeaderboard() {
      const querySnapshot = await getDocs(collection(db, "qrcodes"));
      const listEl = document.getElementById('code-list');
      const leaderboardEl = document.getElementById('leaderboard');
      
      listEl.innerHTML = "";
      leaderboardEl.innerHTML = "";

      const scores = {};
      const itemList = [];

      querySnapshot.forEach((docSnapshot) => {
        itemList.push({
          id: docSnapshot.id,
          ...docSnapshot.data()
        });
      });

      itemList.sort((a, b) => {
        const indexA = generatedCodes.indexOf(a.id);
        const indexB = generatedCodes.indexOf(b.id);
        if (indexA !== -1 && indexB !== -1) return indexA - indexB;
        return a.name.localeCompare(b.name, undefined, { numeric: true });
      });

      itemList.forEach((data) => {
        const card = document.createElement('div');
        
        const isFound = data.isFound;
        const finder = data.finderName;
        const points = Number(data.points) || 1;
        const imageUrl = data.imageUrl;

        if (isFound && finder) {
          scores[finder] = (scores[finder] || 0) + points;
        }

        let diffText = "Könnyű";
        let diffBadgeClass = "bg-emerald-950/60 text-emerald-400 border-emerald-800/80";
        
        if (points === 2) {
          diffText = "Közepes";
          diffBadgeClass = "bg-amber-950/60 text-amber-400 border-amber-800/80";
        } else if (points >= 3) {
          diffText = "Nehéz";
          diffBadgeClass = "bg-rose-950/60 text-rose-400 border-rose-800/80";
        }

        card.className = `p-3 rounded border text-sm flex flex-col justify-between ${
          isFound 
            ? 'bg-neutral-800/30 border-orange-500/20 text-neutral-300' 
            : 'bg-neutral-800/80 border-neutral-700/80 text-neutral-400'
        }`;

        let imageHtml = "";
        if (imageUrl) {
          imageHtml = `<img src="${imageUrl}" alt="${data.name}" class="w-full h-28 object-cover rounded border border-neutral-700/50 transition-all duration-500 ${isFound ? '' : 'blur-md select-none pointer-events-none'}">`;
        } else {
          imageHtml = `<div class="w-full h-20 bg-neutral-900/60 rounded flex items-center justify-center border border-neutral-800 text-neutral-600 text-xs ${isFound ? '' : 'blur-[2px] select-none'}">${isFound ? 'Kép helye' : '🔒 Rejtett kép'}</div>`;
        }

        card.innerHTML = `
          <div>
            <div class="flex justify-between items-center text-[10px] uppercase font-semibold mb-1">
              <span class="px-1.5 py-0.5 rounded border ${diffBadgeClass}">
                ${diffText}
              </span>
              <span class="text-neutral-500 font-mono">${points} pt</span>
            </div>

            ${imageHtml}

            <div class="flex justify-between items-center my-2">
              <span class="font-medium text-neutral-200">${data.name}</span>
              <span class="px-2 py-0.5 text-[10px] font-semibold rounded ${
                isFound 
                  ? 'bg-orange-500/10 text-orange-400 border border-orange-500/20' 
                  : 'bg-neutral-700/50 text-neutral-500'
              }">
                ${isFound ? 'FELFEDVE' : 'REJTVE'}
              </span>
            </div>
          </div>

          <div class="flex justify-between items-center text-xs text-neutral-400 pt-2 border-t border-neutral-700/40 mt-1">
            <span class="text-neutral-500 text-[11px]">Megtaláló</span>
            ${
              isFound && finder 
                ? `<span class="text-orange-300/90 font-medium">${finder}</span>` 
                : '<span class="text-neutral-600 italic">Még rejtve</span>'
            }
          </div>
        `;
        listEl.appendChild(card);
      });

      const sortedPlayers = Object.entries(scores).sort((a, b) => b[1] - a[1]);

      if (sortedPlayers.length === 0) {
        leaderboardEl.innerHTML = `<p class="text-neutral-500 text-xs italic py-1">Még senki nem szerzett pontot.</p>`;
      } else {
        sortedPlayers.forEach(([player, score], index) => {
          const row = document.createElement('div');
          row.className = "flex justify-between items-center py-1 px-2 rounded bg-neutral-900/50 border border-neutral-800/80 text-xs";
          
          row.innerHTML = `
            <span class="font-medium text-neutral-300">${index + 1}. ${player}</span>
            <span class="font-bold text-orange-400">${score} pont</span>
          `;
          leaderboardEl.appendChild(row);
        });
      }
    }

    initGame();
  </script>
</body>
</html>
